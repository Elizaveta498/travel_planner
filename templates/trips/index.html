{% extends 'trips/base.html' %}
{% load static %}

{% block content %}
<h1>🌍 Популярные направления путешествий</h1>

{% for city in cities %}
<div class="city-card">
    <img src="{% static 'images/' %}{{ city.image }}" alt="{{ city.name }}">
    <h2>{{ city.name }}, {{ city.country }}</h2>
    <p>💰 ${{ city.price }}</p>
</div>
{% endfor %}

<h2>💡 Советы</h2>
<ul>
    {% for tip in tips %}
    <li>{{ tip }}</li>
    {% endfor %}
</ul>
{% endblock %}
